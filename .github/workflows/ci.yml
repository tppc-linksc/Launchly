name: CI

on:
  push:
    branches: [master, 'refactor/**']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reject skipped or focused tests
        run: pnpm test:policy

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: API tests and coverage floor (Jest)
        run: pnpm --dir services/api test:coverage

      - name: API startup smoke test
        run: pnpm test:api:e2e

      - name: Frontend tests and coverage floor (Vitest)
        run: pnpm --dir apps/web test:coverage

      - name: CLI tests and coverage floor (Vitest)
        run: pnpm --dir cli test:coverage

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: cd services/api && npx prisma generate

      - name: API type check
        run: cd services/api && npx tsc --noEmit

      - name: Frontend type check
        run: cd apps/web && npx vue-tsc --noEmit

      - name: CLI type check
        run: cd cli && npx tsc --noEmit

  migrations:
    name: Prisma migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: launchly
          POSTGRES_PASSWORD: launchly_ci_password
          POSTGRES_DB: launchly
        options: >-
          --health-cmd "pg_isready -U launchly -d launchly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      LAUNCHLY_DATABASE_URL: postgresql://launchly:launchly_ci_password@localhost:5432/launchly
      LAUNCHLY_SHADOW_DATABASE_URL: postgresql://launchly:launchly_ci_password@localhost:5432/launchly_shadow
      LAUNCHLY_REQUIRE_SCHEMA_DIFF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create isolated shadow database
        run: psql "$LAUNCHLY_DATABASE_URL" -c 'CREATE DATABASE launchly_shadow'
      - name: Apply migrations and verify schema drift
        run: ./scripts/verify-schema.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: cd services/api && npx prisma generate

      - name: Build frontend
        run: pnpm build:web

      - name: Build API
        run: cd services/api && npx nest build

      - name: Build CLI
        run: cd cli && pnpm build
