packages:
  - 'apps/*'
  - 'cli'
  - 'services/*'

# pnpm v11+: lifecycle scripts on dependencies must be explicitly allowed (replaces onlyBuiltDependencies).
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  cpu-features: true
  esbuild: true
  prisma: true
  ssh2: true
  vue-demi: true

# Element Plus 2.14.1 declares VueUse 14.3, whose generated bundle contains
# stale pure-annotation comments that trigger Rollup warnings. Keep the
# compatible patched release in every workspace through the lockfile.
overrides:
  '@vueuse/core': ^14.4.0
